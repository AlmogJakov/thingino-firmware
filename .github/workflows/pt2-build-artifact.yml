name: pt2-build-artifact
# Build ONLY the Sonoff PT2 (T23N / sc2336p / atbm6012bx) firmware and upload the
# resulting images as a downloadable Actions artifact.
#
#   manual only (workflow_dispatch) - no release - no Telegram - no flashing -
#   no secrets (read-only token) - single board.
#
# Same build commands as thingino's CI (make source + make fast), so the prudynt
# 0001-0014 patches and the overlay/package changes are baked into the image.
# A run is a full build (~1-2 h: toolchain + packages); no caching is configured, so reruns take about the same time.
#
# Run:      Actions -> "pt2-build-artifact" -> Run workflow (pick the pt2-firmware branch).
# Download: the finished run -> Artifacts -> "pt2-firmware-images".

on:
  workflow_dispatch:

permissions:
  contents: read          # read-only: cannot create releases/tags or push anything

env:
  BOARD: sonoff_pt2_t23n_sc2336p_atbm6012bx
  FORCE_UNSAFE_CONFIGURE: 1
  TERM: linux
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends --no-install-suggests \
            autoconf build-essential bc ca-certificates cmake cpio curl file \
            gawk git jq lzop m4 make p7zip-full perl procps python3 rsync \
            tzdata u-boot-tools unzip wget

      - name: Set timezone
        run: ln -sf /usr/share/zoneinfo/UTC /etc/localtime && echo UTC > /etc/timezone

      - name: Checkout firmware (selected branch, with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'true'      # buildroot/ is a submodule; the build needs it
          fetch-depth: '0'

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Confirm prudynt patches 0001-0015 present (fail fast before build)
        run: |
          D=package/all-patches/prudynt-t
          [ -d "$D" ] || { echo "::error::$D missing"; exit 1; }
          ls -l "$D"
          miss=0
          for n in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015; do
            ls "$D"/"$n"-*.patch >/dev/null 2>&1 && echo "PASS: patch $n present" || { echo "::error::missing patch $n-*.patch"; miss=1; }
          done
          [ "$miss" = 0 ] && echo "ALL 15 PRUDYNT PATCHES PRESENT (0001-0015)" || exit 1

      - name: Download sources
        run: BOARD="$BOARD" make source WORKFLOW=1

      - name: Build firmware (full image; bakes patches + overlay + package files)
        # `make fast` = defconfig + parallel build + pack (thingino's own CI command).
        run: BOARD="$BOARD" make fast WORKFLOW=1

      - name: Confirm prudynt patches were applied to the source
        # Non-fragile, source-level: buildroot's apply-patches.sh records every applied
        # patch in the package build dir's .applied_patches_list as a FULL PATH per line,
        # ending in /<basename>.patch (e.g. .../prudynt-t/0001-...patch). No binary introspection.
        run: |
          SRC=""
          for d in $(find output -type d -name 'prudynt-t-*' 2>/dev/null | grep -v '/host/'); do
            [ -f "$d/.applied_patches_list" ] && { SRC="$d"; break; }
          done
          [ -n "$SRC" ] || SRC=$(find output -type d -name 'prudynt-t-*' 2>/dev/null | grep -v '/host/' | head -1)
          [ -n "$SRC" ] || { echo "::error::prudynt-t source dir not found under output/"; exit 1; }
          echo "prudynt source: $SRC"
          LIST="$SRC/.applied_patches_list"
          if [ -f "$LIST" ]; then
            echo "== .applied_patches_list =="; cat "$LIST"
            miss=0
            for n in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015; do
              grep -qE "/${n}-.*\.patch$" "$LIST" && echo "PASS: patch $n applied" || { echo "::error::patch $n not in .applied_patches_list"; miss=1; }
            done
            [ "$miss" = 0 ] && echo "ALL 15 PRUDYNT PATCHES APPLIED (0001-0015)" || exit 1
          elif [ -f "$SRC/.stamp_patched" ]; then
            echo "::warning::.applied_patches_list absent; .stamp_patched present (patch phase ran), cannot enumerate per-patch"
          else
            echo "::error::no .applied_patches_list and no .stamp_patched - cannot confirm patches applied"; exit 1
          fi
          # 0015 direct-read overlay must be in the built source, and NO debug scaffolding
          # (a prior diagnostic build leaked startup-trace markers) may have crept back in.
          grep -qF "/etc/daynight.state" "$SRC/src/Config.cpp" \
            && echo "PASS: 0015 direct-read sidecar overlay present in source" \
            || { echo "::error::Config.cpp: 0015 direct-read overlay (/etc/daynight.state) not applied"; exit 1; }
          DBG=$(grep -rnoE 'DIAG:|startup-trace|HANDLER entered|\bacq1\b|\bacq2\b' "$SRC/src" 2>/dev/null | head -20)
          [ -z "$DBG" ] && echo "PASS: no debug scaffolding markers in prudynt source" \
            || { echo "::error::debug scaffolding markers in prudynt source:"; echo "$DBG"; exit 1; }

      - name: Collect built images
        # Images land under output/<branch>/<camera>-<kernel>-<libc>/images/, not
        # output/images/. Locate the dir holding the packed firmware and flatten it.
        run: |
          BIN=$(find output -type f -name 'thingino-*.bin' 2>/dev/null | head -1)
          [ -n "$BIN" ] || { echo "::error::build produced no thingino-*.bin under output/"; exit 1; }
          IMG_DIR=$(dirname "$BIN")
          echo "images dir: $IMG_DIR"
          mkdir -p artifacts
          cp -a "$IMG_DIR"/. artifacts/
          echo "== artifacts =="; ls -lh artifacts/

      - name: Verify rootfs (safety gate - runs BEFORE upload)
        # Extract rootfs.squashfs and assert the motors de-loop, executable modes,
        # absence of /rom/usr/bin/motors, and that the doc isn't baked. Any failure
        # fails the run, so a bad image is never uploaded.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends squashfs-tools
          SQ=$(find artifacts output -name 'rootfs.squashfs' 2>/dev/null | head -1)
          [ -n "$SQ" ] || { echo "::error::rootfs.squashfs not found"; exit 1; }
          echo "squashfs: $SQ"
          rm -rf rootfs_check
          unsquashfs -d rootfs_check "$SQ" >/dev/null
          ROOT=rootfs_check
          fail=0
          err() { echo "::error::FAIL: $1"; fail=1; }
          ok()  { echo "PASS: $1"; }
          M="$ROOT/usr/bin/motors"; B="$ROOT/usr/bin/motors-bin"

          # --- motors wrapper (the self-exec de-loop) ---
          [ -x "$M" ] && ok "/usr/bin/motors executable" || err "/usr/bin/motors missing or not executable"
          head -1 "$M" 2>/dev/null | grep -q '^#!/bin/sh' && ok "/usr/bin/motors is a #!/bin/sh wrapper" || err "/usr/bin/motors is not a /bin/sh wrapper"
          file "$M" 2>/dev/null | grep -q 'ELF' && err "/usr/bin/motors is an ELF (must be the script wrapper, not the binary)" || ok "/usr/bin/motors is not an ELF"
          grep -q '/usr/bin/motors-bin' "$M" 2>/dev/null && ok "/usr/bin/motors references motors-bin" || err "/usr/bin/motors does not reference motors-bin"
          grep -q '/rom/usr/bin/motors' "$M" 2>/dev/null && err "/usr/bin/motors still references /rom/usr/bin/motors" || ok "/usr/bin/motors has no /rom reference"

          # --- real motor client (proves the .mk retarget) ---
          [ -x "$B" ] && ok "/usr/bin/motors-bin executable" || err "/usr/bin/motors-bin missing or not executable"
          file "$B" 2>/dev/null | grep -qE 'ELF' && ok "/usr/bin/motors-bin is an ELF" || err "/usr/bin/motors-bin is not an ELF executable"

          # --- runtime scripts must be executable (new + modified; adapter prudynt.sh is 0644 by design, not checked) ---
          for f in \
            usr/sbin/physical-privacy usr/sbin/tz-update usr/sbin/light \
            usr/sbin/daynight usr/sbin/color usr/sbin/imp-control \
            usr/sbin/daynight-state \
            etc/init.d/S31prudynt etc/init.d/S32prudyntwd etc/init.d/S56ircut \
            etc/init.d/S01timezone etc/init.d/S60physical-privacy etc/ntpd_callback; do
            [ -x "$ROOT/$f" ] && ok "$f executable" || err "$f missing or not executable"
          done

          # --- documentation must NOT be baked into the rootfs ---
          find "$ROOT" -name 'PT2-FIX-SET.md' | grep -q . && err "PT2-FIX-SET.md was installed into the rootfs" || ok "PT2-FIX-SET.md not in rootfs"

          # --- core deliverable present ---
          { [ -f "$ROOT/usr/bin/prudynt" ] && file "$ROOT/usr/bin/prudynt" 2>/dev/null | grep -qE 'ELF'; } && ok "prudynt binary present (ELF)" || err "prudynt binary missing or not ELF"

          # --- SHIM REGRESSION GUARD (the REAL failure mode) ---
          # The startup SIGSEGV was NEVER prudynt/0015: it is a regressed libuclibcshim.so
          # (the glibc->uClibc ABI shim prudynt force-links). A bad shim build faults in its
          # own stdio bridge (__fputc_unlocked, +0xbc8) and crashes EVERY prudynt at startup;
          # the proven prudynt boots fine against a good shim. Refuse to ship the known-bad
          # shim. (No daynight.state grep here -- the proven prudynt legitimately contains the
          # prudynt_daynight_state Prometheus metric, so that check was a false positive.)
          # REQUIRE the pinned, proven-good shim (07710f80). The package installs a
          # committed prebuilt; if the shipped shim is anything else, the pin was
          # bypassed / the toolchain rebuilt it -> refuse (a rebuilt shim is unverified
          # and was what crashed every prudynt). Re-pin only after verifying prudynt boots.
          GOOD_SHIM="07710f80ebc4683c9a9c658142a3cdce018db2949b844647e1709446e21c369b"
          SHIM=$(find "$ROOT" -name 'libuclibcshim.so' 2>/dev/null | head -1)
          if [ -z "$SHIM" ]; then
            err "libuclibcshim.so not found in rootfs"
          else
            shimsha=$(sha256sum "$SHIM" | cut -d' ' -f1)
            if [ "$shimsha" = "$GOOD_SHIM" ]; then
              ok "libuclibcshim.so is the PINNED proven-good build ($shimsha)"
            else
              err "libuclibcshim.so sha $shimsha != pinned-good $GOOD_SHIM -- shim was rebuilt/changed; refusing to ship (re-pin only after verifying prudynt boots)"
            fi
          fi
          # --- day/night DIRECT-READ (0015): the /etc/daynight.state sidecar is the single
          #     source of truth and prudynt reads it itself at config-load, so S31 must
          #     MIGRATE (seed/repair the sidecar) but must NOT sync it back into prudynt.json
          #     (the per-boot 8.5KB rewrite is gone). The prudynt binary must reference the
          #     sidecar path. ---
          grep -q 'daynight-state migrate' "$ROOT/etc/init.d/S31prudynt" 2>/dev/null \
            && ok "S31prudynt runs pre-start 'daynight-state migrate'" || err "S31prudynt missing pre-start 'daynight-state migrate'"
          if grep -q 'daynight-state sync-to-config' "$ROOT/etc/init.d/S31prudynt" 2>/dev/null; then
            err "S31prudynt still calls 'daynight-state sync-to-config' — direct-read (0015) must NOT sync the sidecar into prudynt.json"
          else
            ok "S31prudynt does NOT sync-to-config (direct-read; no per-boot prudynt.json rewrite)"
          fi
          if grep -aqF '/etc/daynight.state' "$ROOT/usr/bin/prudynt" 2>/dev/null; then
            ok "prudynt binary references /etc/daynight.state (0015 direct-read overlay baked in)"
          else
            err "prudynt binary does NOT reference /etc/daynight.state — 0015 overlay missing from shipped binary"
          fi

          # --- strongest anti-loop net: NO /rom/usr/bin/motors anywhere in the rootfs ---
          HITS=$(grep -rIl '/rom/usr/bin/motors' "$ROOT" 2>/dev/null || true)
          [ -z "$HITS" ] && ok "no /rom/usr/bin/motors anywhere in rootfs" || err "/rom/usr/bin/motors referenced in: $(echo "$HITS" | sed "s#$ROOT/##g" | tr '\n' ' ')"

          echo "------------------------------------------------------------"
          if [ "$fail" = 0 ]; then echo "ROOTFS VERIFICATION PASSED"; else echo "::error::ROOTFS VERIFICATION FAILED"; exit 1; fi

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: pt2-firmware-images
          path: artifacts/*
          if-no-files-found: error
