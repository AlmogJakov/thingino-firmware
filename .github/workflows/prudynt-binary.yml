name: prudynt-binary
# Builds the firmware for the Sonoff PT2 (T23 / sc2336p) board with the
# daynight-stats + forced-mode patch applied, and uploads ONLY the resulting
# prudynt binary as a downloadable artifact (you copy it to /usr/bin/prudynt;
# no flashing, no firmware image needed).
#
# Run it: Actions tab -> "prudynt-binary" -> Run workflow -> pick your branch.
# Download: the finished run -> Artifacts -> "prudynt-<board>".
#
# It uses the exact two build commands thingino's own CI uses (make source +
# make), so prudynt is compiled with our patch as part of the normal build.
# First run can take ~1-2 h (toolchain + packages). Free GitHub runners.

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Camera/board config name'
        required: true
        default: 'sonoff_pt2_t23n_sc2336p_atbm6012bx'

env:
  FORCE_UNSAFE_CONFIGURE: 1
  TERM: linux
  TZ: UTC

jobs:
  build-prudynt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends --no-install-suggests \
            autoconf build-essential bc ca-certificates cmake cpio curl file \
            gawk git jq lzop m4 make p7zip-full perl procps python3 rsync \
            tzdata u-boot-tools unzip wget

      - name: Set timezone
        run: ln -sf /usr/share/zoneinfo/UTC /etc/localtime && echo UTC > /etc/timezone

      - name: Checkout firmware (this branch, with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: '0'

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show the prudynt patch that will be applied
        # thingino uses a GLOBAL patch dir: BR2_GLOBAL_PATCH_DIR=package/all-patches,
        # so package patches live in package/all-patches/<pkg>/ (NOT package/<pkg>/patches/).
        run: |
          echo "Patches present for prudynt-t:"
          ls -l package/all-patches/prudynt-t/ \
            || { echo "::error::no patch in package/all-patches/prudynt-t/ — aborting"; exit 1; }

      - name: Download sources
        run: BOARD=${{ github.event.inputs.board }} make source WORKFLOW=1

      - name: Build firmware (compiles prudynt with the patch)
        # `make fast` is the parallel full build thingino's own CI uses.
        run: BOARD=${{ github.event.inputs.board }} make fast WORKFLOW=1

      - name: Confirm the FINAL patch actually applied
        run: |
          SRC=$(find output -type d -name 'prudynt-t-*' 2>/dev/null | grep -v '/host/' | head -1)
          echo "prudynt source dir: $SRC"
          [ -n "$SRC" ] || { echo "::error::prudynt source dir not found"; exit 1; }
          ok=1
          # 1) config key (all versions)
          grep -qF "force_mode_cfg" "$SRC/src/Config.hpp" \
            || { echo "::error::Config.hpp: force_mode_cfg missing — patch did not apply"; ok=0; }
          # 2) IMPSystem EARLY-DERIVE of running_mode from force_mode (final patch only;
          #    a stale patch sets a local boot_mode at end-of-init instead)
          grep -qF "image.running_mode = static_cast<int>(hal::isp::RunningMode::" "$SRC/src/IMPSystem.cpp" \
            || { echo "::error::IMPSystem.cpp: early-derive missing — STALE patch, not the final single-source version"; ok=0; }
          # 3) worker RECORD block (final patch references force_mode_cfg in the worker)
          grep -qF "force_mode_cfg" "$SRC/src/DayNightWorker.cpp" \
            || { echo "::error::DayNightWorker.cpp: record block missing — STALE patch"; ok=0; }
          # 4) must NOT be the rejected v3 deferred-apply variant
          if grep -qF "pending_force_apply" "$SRC/src/DayNightWorker.cpp"; then
            echo "::error::DayNightWorker.cpp: contains pending_force_apply — this is the rejected v3 deferred patch"; ok=0
          fi
          # 5) encoder config-change restart fix (Part 2): JsonAPI handle_stream
          #    rebuilds the pipeline when a numeric encoder field changes.
          grep -qF "rtsp_too" "$SRC/src/JsonAPI.cpp" \
            || { echo "::error::JsonAPI.cpp: rtsp_too missing — encoder config-change restart fix (Part 2) not applied"; ok=0; }
          [ "$ok" = 1 ] && echo "FINAL PATCH CONFIRMED (Part 1: config key + early-derive + record block, no v3; Part 2: JsonAPI encoder restart)" || exit 1

      - name: Locate the built MIPS prudynt binary
        id: find
        run: |
          # prefer the binary staged into the target rootfs
          BIN=$(find output -type f -path '*/target/usr/bin/prudynt' 2>/dev/null | head -1)
          # fall back to the package build dir
          [ -z "$BIN" ] && BIN=$(find output -type f -path '*prudynt-t-*' -name prudynt 2>/dev/null | grep -v '/host/' | head -1)
          echo "Found: $BIN"
          file "$BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Upload prudynt binary
        uses: actions/upload-artifact@v4
        with:
          name: prudynt-${{ github.event.inputs.board }}
          path: ${{ steps.find.outputs.bin }}
          if-no-files-found: error
